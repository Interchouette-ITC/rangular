<section class="pipes-demo" aria-label="Pipes">
  <p class="upper">{{ label | uppercase }}</p>
  <p class="lower">{{ label | lowercase }}</p>
  <p class="amount">{{ amount | number }}</p>
  <p class="json">{{ label | json }}</p>
  <p class="crab">{{ label | crab }}</p>
  <span [attr.title]="label | uppercase">ok</span>
</section>
