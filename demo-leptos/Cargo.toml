[package]
name = "rangular-demo"
description = "Browser demo for rangular (Leptos CSR + colocated panels)"
version = "1.0.4"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
gloo-timers = { version = "0.4", features = ["futures"] }
kode-leptos = "0.5.5"
leptos = { version = "0.8", features = ["csr"] }
rangular-aot = { path = "../crates/rangular-aot" }
rangular-expr = { path = "../crates/rangular-expr" }
rangular-host = { path = "../crates/rangular-host" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Window",
    "KeyboardEvent",
    "Event",
    "HtmlInputElement",
    "HtmlElement",
    "Element",
    "Document",
    "Node",
    "NodeList",
    "Location",
    "Storage",
] }

[build-dependencies]
rangular-aot = { path = "../crates/rangular-aot" }
rangular-css = { path = "../crates/rangular-css" }
