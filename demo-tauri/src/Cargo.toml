[package]
name = "rangular-demo-tauri"
description = "Tauri shell for the rangular Leptos demo (CSR / wasm)"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.88"

[lib]
name = "rangular_demo_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rangular-demo-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
