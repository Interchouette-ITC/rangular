# Paths excluded from Codecov totals (demo hosts).
# Plain folder paths only (Codecov treats entries as regex; avoid ** bombs).
# Upload token stays in GitHub Actions secrets, not here.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "demo-leptos"
  - "demo-tauri"
