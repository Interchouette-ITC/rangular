[package]
name = "rangular-build"
description = "Build support for compiling rangular HTML templates and SCSS in Cargo build scripts"
readme = "README.md"
keywords = ["angular", "leptos", "build-script", "templates", "scss"]
categories = ["development-tools::build-utils", "template-engine"]
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
# The consumer-fixture test needs the repository; it runs in workspace CI.
exclude = ["tests/"]

[dependencies]
rangular-aot = { workspace = true }
rangular-css = { workspace = true }
