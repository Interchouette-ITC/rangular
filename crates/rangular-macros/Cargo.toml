[package]
name = "rangular-macros"
description = "Proc macros for rangular component templates"
readme = "README.md"
keywords = ["angular", "leptos", "proc-macro", "templates"]
categories = ["template-engine", "development-tools::procedural-macro-helpers"]
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
