[package]
name = "rangular-aot"
description = "Compile-time lowering of rangular templates to Leptos"
readme = "README.md"
keywords = ["angular", "leptos", "templates", "codegen", "compiler"]
categories = ["template-engine", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
proc-macro2 = "1"
quote = "1"
rangular-expr = { workspace = true }
rangular-host = { workspace = true }
rangular-parser = { workspace = true }
send_wrapper = "0.6"
syn = { version = "3", features = ["parsing"] }

[dev-dependencies]
syn = { version = "3", features = ["full"] }
