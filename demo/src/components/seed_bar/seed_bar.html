<section class="seed-bar" aria-label="Seed controls">
  <label for="demo-seed-input">Seed</label>
  <input
    id="demo-seed-input"
    type="text"
    [(value)]="seed"
    spellcheck="false"
    autocomplete="off"
  />
  <button
    class="btn btn-primary"
    type="button"
    [disabled]="generateDisabled"
    (click)="onGenerate()"
  >
    Generate
  </button>
  <button
    class="btn btn-secondary"
    type="button"
    [disabled]="randomDisabled"
    (click)="onRandom()"
  >
    Random
  </button>
</section>
