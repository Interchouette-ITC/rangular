<section class="template-outlet" aria-label="Template outlet">
  <div class="template-outlet__row">
    <span class="template-outlet__ref">#card</span>
    <span class="template-outlet__via">outlet →</span>
    <div class="template-outlet__stamp">
      <ng-container [ngTemplateOutlet]="card"></ng-container>
    </div>
  </div>
  <ng-template #card>
    <p class="card">{{ label }}</p>
  </ng-template>
</section>
