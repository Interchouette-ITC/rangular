[workspace]
members = [
    "crates/rangular",
    "crates/rangular-aot",
    "crates/rangular-build",
    "crates/rangular-css",
    "crates/rangular-expr",
    "crates/rangular-host",
    "crates/rangular-macros",
    "crates/rangular-parser",
    "crates/rangular-runtime",
]
exclude = ["demo-leptos", "demo-tauri/src", "fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license-file = "LICENSE"
version = "1.1.0"
authors = ["Interchouette"]
repository = "https://github.com/Interchouette-ITC/rangular"
rust-version = "1.100"

[workspace.dependencies]
rangular-aot = { path = "crates/rangular-aot", version = "1.1.0" }
rangular-css = { path = "crates/rangular-css", version = "1.1.0" }
rangular-expr = { path = "crates/rangular-expr", version = "1.1.0" }
rangular-host = { path = "crates/rangular-host", version = "1.1.0" }
rangular-macros = { path = "crates/rangular-macros", version = "1.1.0" }
rangular-parser = { path = "crates/rangular-parser", version = "1.1.0" }
rangular-runtime = { path = "crates/rangular-runtime", version = "1.1.0" }
